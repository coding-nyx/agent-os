[project]
name = "ara-agent-os"
dynamic = ["version"]
description = "ARA Agent OS — local-first data, agents and connected machines"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1",
  "websockets>=15,<17", "PyYAML>=6,<7", "cryptography>=44,<50",
  "python-multipart>=0.0.20,<1", "jsonschema>=4.23,<5", "alembic>=1.14,<2",
]
[project.scripts]
ara = "ara_os.cli:main"
agent-os = "ara_os.cli:main"
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "playwright>=1.50,<2"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/ara_os"]
[tool.hatch.version]
path = "src/ara_os/__init__.py"
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
